<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Futuristic coding activity terminal">
  <rect width="1200" height="320" fill="#061322"/>
  <defs>
    <linearGradient id="terminalFrame" x1="0" x2="1">
      <stop offset="0%" stop-color="#0d1e2d"/>
      <stop offset="100%" stop-color="#0a1626"/>
    </linearGradient>
  </defs>

  <rect x="70" y="40" width="1060" height="240" rx="18" fill="url(#terminalFrame)" stroke="#2a496d" stroke-width="1.4"/>
  <circle cx="110" cy="73" r="6" fill="#ff6b6b"/>
  <circle cx="130" cy="73" r="6" fill="#f4d27a"/>
  <circle cx="150" cy="73" r="6" fill="#63d98a"/>

  <g fill="#8ec5ff" font-family="Consolas, monospace" font-size="18" font-weight="700">
    <text x="110" y="120">&gt; solving_problem()</text>
    <text x="110" y="160">&gt; analyzing_data()</text>
    <text x="110" y="200">&gt; building_project()</text>
    <text x="110" y="240">&gt; improving_skills()</text>
  </g>

  <g fill="#f3d788" font-family="Consolas, monospace" font-size="18" font-weight="700">
    <text x="110" y="280">&gt; learning_ai()</text>
    <text x="620" y="280">system_status: ACTIVE</text>
  </g>

  <g>
    <rect x="900" y="115" width="20" height="24" fill="#f3d788" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 0 0" dur="0.8s" repeatCount="indefinite"/>
  </g>
</svg>
