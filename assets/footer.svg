<svg width="1200" height="100" viewBox="0 0 1200 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5EE7FF"/>
      <stop offset="40%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#F8D66D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="100" rx="18" fill="#0B1120"/>
  <path d="M20 50H1180" stroke="url(#footerLine)" stroke-width="1.6" stroke-dasharray="10 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="12s" repeatCount="indefinite"/>
  </path>

  <text x="600" y="58" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" fill="#E5E7EB" letter-spacing="3">
    &lt; BUILD • LEARN • ANALYZE • CREATE • REPEAT /&gt;
  </text>

  <circle cx="110" cy="50" r="4" fill="#5EE7FF">
    <animate attributeName="cx" values="110;1080;110" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1090" cy="50" r="4" fill="#F8D66D">
    <animate attributeName="cx" values="1090;110;1090" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>
