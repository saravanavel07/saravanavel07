<svg width="1400" height="220" viewBox="0 0 1400 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Royal footer data stream">
  <defs>
    <linearGradient id="footerBg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#091321"/>
      <stop offset="100%" stop-color="#101c35"/>
    </linearGradient>
    <linearGradient id="streamFlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#79d5ff"/>
      <stop offset="45%" stop-color="#4e6fff"/>
      <stop offset="68%" stop-color="#f4d27a"/>
      <stop offset="100%" stop-color="#edc768"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="220" fill="url(#footerBg)"/>
  <g stroke="url(#streamFlow)" stroke-width="2.2" fill="none" opacity="0.9">
    <path d="M0 110 C 140 60, 220 170, 340 110 S 560 70, 700 120 S 910 145, 1040 95 S 1260 75, 1400 120" stroke-dasharray="10 12">
      <animate attributeName="stroke-dashoffset" values="0;1000" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#f4d27a" opacity="0.9">
    <circle cx="120" cy="100" r="4">
      <animateMotion dur="7.5s" repeatCount="indefinite" path="M0 0 C 150 20, 220 -30, 340 20 S 620 10, 760 40 S 1090 90, 1240 0"/>
    </circle>
    <circle cx="180" cy="150" r="3.5">
      <animateMotion dur="9s" repeatCount="indefinite" path="M0 0 C 80 -25, 200 30, 320 0 S 610 70, 760 60 S 1060 35, 1230 65"/>
    </circle>
    <circle cx="1090" cy="85" r="4">
      <animateMotion dur="8s" repeatCount="indefinite" path="M0 0 C -70 20, -150 40, -220 10 S -440 10, -560 18 S -860 80, -980 30"/>
    </circle>
  </g>

  <g fill="#7ec7ff" opacity="0.8">
    <circle cx="70" cy="150" r="3">
      <animateMotion dur="8s" repeatCount="indefinite" path="M0 0 C 120 0, 220 -20, 410 20 S 760 25, 980 50 S 1190 35, 1310 20"/>
    </circle>
  </g>
</svg>
