<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SARAVANA VEL AI core network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="52%" stop-color="#0c1630"/>
      <stop offset="100%" stop-color="#111b3b"/>
    </linearGradient>
    <linearGradient id="line1" x1="0" x2="1">
      <stop offset="0%" stop-color="#69C5FF"/>
      <stop offset="100%" stop-color="#7F6CFF"/>
    </linearGradient>
    <linearGradient id="line2" x1="0" x2="1">
      <stop offset="0%" stop-color="#F4D27A"/>
      <stop offset="100%" stop-color="#F8E9B2"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#feefb9" stop-opacity="1"/>
      <stop offset="35%" stop-color="#f4d27a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f4d27a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <g opacity="0.28">
    <circle cx="120" cy="80" r="1.6" fill="#9ad8ff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="120" r="2" fill="#f4d27a"/>
    <circle cx="970" cy="65" r="1.5" fill="#7ac7ff"/>
    <circle cx="1090" cy="145" r="2.3" fill="#d7b863"/>
    <circle cx="310" cy="340" r="1.8" fill="#8ee0ff"/>
    <circle cx="840" cy="300" r="2" fill="#caa65f"/>
  </g>

  <g stroke="url(#line1)" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M500 210 L610 130 L700 210"/>
    <path d="M500 210 L610 270 L700 210"/>
    <path d="M610 130 L690 80"/>
    <path d="M610 270 L690 330"/>
    <path d="M610 130 L540 90"/>
    <path d="M610 270 L540 330"/>
    <path d="M690 80 L770 120"/>
    <path d="M690 330 L770 280"/>
    <path d="M690 210 L840 210"/>
  </g>

  <g stroke="url(#line2)" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M500 210 L450 150 L390 150"/>
    <path d="M500 210 L450 270 L390 270"/>
    <path d="M650 90 L780 50"/>
    <path d="M650 330 L780 370"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="500" cy="210" r="40" fill="url(#coreGlow)"/>
    <circle cx="500" cy="210" r="8" fill="#f4d27a">
      <animate attributeName="r" values="7;9;7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <circle cx="500" cy="210" r="12" fill="#f4d27a"/>
    <circle cx="610" cy="130" r="10" fill="#69C5FF"/>
    <circle cx="610" cy="270" r="10" fill="#69C5FF"/>
    <circle cx="700" cy="210" r="10" fill="#8e7dff"/>
    <circle cx="690" cy="80" r="10" fill="#b8d3ff"/>
    <circle cx="690" cy="330" r="10" fill="#b8d3ff"/>
    <circle cx="770" cy="120" r="10" fill="#8bd7ff"/>
    <circle cx="770" cy="280" r="10" fill="#8bd7ff"/>
    <circle cx="390" cy="150" r="10" fill="#87ceff"/>
    <circle cx="390" cy="270" r="10" fill="#87ceff"/>
    <circle cx="450" cy="150" r="10" fill="#d9b55f"/>
    <circle cx="450" cy="270" r="10" fill="#d9b55f"/>
    <circle cx="840" cy="210" r="12" fill="#f4d27a"/>
  </g>

  <g fill="#f5f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
    <text x="210" y="150">AI CORE</text>
    <text x="365" y="112">DATA</text>
    <text x="355" y="327">PYTHON</text>
    <text x="750" y="100">SQL</text>
    <text x="760" y="260">ANALYTICS</text>
    <text x="900" y="214">INSIGHTS</text>
  </g>

  <g>
    <circle cx="150" cy="300" r="6" fill="#69C5FF">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 0 0 C 80 30, 160 -20, 230 0"/>
    </circle>
    <circle cx="870" cy="140" r="6" fill="#F4D27A">
      <animateMotion dur="7s" repeatCount="indefinite" path="M 0 0 C -90 25, -170 60, -260 10"/>
    </circle>
    <circle cx="260" cy="220" r="4" fill="#5ED3FF">
      <animateMotion dur="5s" repeatCount="indefinite" path="M 0 0 C 70 -30, 180 15, 260 0"/>
    </circle>
    <circle cx="730" cy="280" r="5" fill="#F4D27A">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 0 0 C 100 10, 140 -20, 180 0"/>
    </circle>
  </g>

  <circle cx="500" cy="210" r="38" fill="none" stroke="#f4d27a" stroke-width="1.2" opacity="0.5">
    <animate attributeName="r" values="34;44;34" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.8;0.25" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>
