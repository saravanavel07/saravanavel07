<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech constellation for Python, SQL, Excel, AI and Power BI">
  <defs>
    <linearGradient id="skillBlue" x1="0" x2="1">
      <stop offset="0%" stop-color="#74d6ff"/>
      <stop offset="100%" stop-color="#4d7bff"/>
    </linearGradient>
    <linearGradient id="skillGold" x1="0" x2="1">
      <stop offset="0%" stop-color="#f5d98d"/>
      <stop offset="100%" stop-color="#d4a94d"/>
    </linearGradient>
    <filter id="pulseGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="#0a1120"/>
  <g opacity="0.28">
    <circle cx="120" cy="60" r="2" fill="#9bcfff"/>
    <circle cx="430" cy="70" r="2.5" fill="#f4d27a"/>
    <circle cx="700" cy="90" r="2.1" fill="#7fd1ff"/>
    <circle cx="1010" cy="80" r="2.2" fill="#d0ad59"/>
  </g>

  <g stroke="url(#skillBlue)" stroke-width="1.8" fill="none" opacity="0.8">
    <path d="M420 260 L560 180 L700 260"/>
    <path d="M420 260 L540 350 L700 260"/>
    <path d="M560 180 L560 110"/>
    <path d="M540 350 L740 420"/>
    <path d="M700 260 L860 210 L980 260"/>
    <path d="M700 260 L860 310 L980 260"/>
    <path d="M860 210 L860 120"/>
    <path d="M860 310 L860 400"/>
  </g>

  <g filter="url(#pulseGlow)">
    <circle cx="420" cy="260" r="12" fill="#d9b15a"/>
    <circle cx="560" cy="180" r="12" fill="#74d6ff"/>
    <circle cx="700" cy="260" r="14" fill="#f5d98d"/>
    <circle cx="540" cy="350" r="12" fill="#8ec5ff"/>
    <circle cx="560" cy="110" r="10" fill="#74d6ff"/>
    <circle cx="740" cy="420" r="10" fill="#74d6ff"/>
    <circle cx="860" cy="210" r="12" fill="#f5d98d"/>
    <circle cx="980" cy="260" r="12" fill="#8ec5ff"/>
    <circle cx="860" cy="120" r="10" fill="#d9b15a"/>
    <circle cx="860" cy="400" r="10" fill="#d9b15a"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#edf5ff">
    <text x="345" y="245">PYTHON</text>
    <text x="495" y="170">DATA</text>
    <text x="610" y="240">SQL</text>
    <text x="460" y="390">EXCEL</text>
    <text x="755" y="220">POWER BI</text>
    <text x="890" y="250">AI</text>
  </g>

  <circle cx="420" cy="260" r="25" fill="none" stroke="#f4d27a" stroke-width="1.3" opacity="0.5">
    <animate attributeName="r" values="20;27;20" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="260" r="28" fill="none" stroke="#75d2ff" stroke-width="1.3" opacity="0.45">
    <animate attributeName="r" values="22;30;22" dur="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="260" r="25" fill="none" stroke="#f4d27a" stroke-width="1.3" opacity="0.42">
    <animate attributeName="r" values="20;27;20" dur="2.9s" repeatCount="indefinite"/>
  </circle>
</svg>
