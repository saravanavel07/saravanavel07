<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Career radar for data analyst with Python, SQL, Power BI, AI">
  <defs>
    <linearGradient id="radarBlue" x1="0" x2="1">
      <stop offset="0%" stop-color="#7ecbff"/>
      <stop offset="100%" stop-color="#4d6fff"/>
    </linearGradient>
    <linearGradient id="radarGold" x1="0" x2="1">
      <stop offset="0%" stop-color="#f5de93"/>
      <stop offset="100%" stop-color="#d8a54a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="#070d1d"/>
  <g>
    <circle cx="600" cy="300" r="210" fill="none" stroke="#1a2c4e" stroke-width="1.3"/>
    <circle cx="600" cy="300" r="150" fill="none" stroke="#1a2c4e" stroke-width="1.1"/>
    <circle cx="600" cy="300" r="90" fill="none" stroke="#1a2c4e" stroke-width="1.1"/>

    <path d="M600 300 L469 150" stroke="url(#radarBlue)" stroke-width="1.6" fill="none" opacity="0.7"/>
    <path d="M600 300 L740 123" stroke="url(#radarBlue)" stroke-width="1.6" fill="none" opacity="0.7"/>
    <path d="M600 300 L425 425" stroke="url(#radarBlue)" stroke-width="1.6" fill="none" opacity="0.7"/>
    <path d="M600 300 L780 440" stroke="url(#radarBlue)" stroke-width="1.6" fill="none" opacity="0.7"/>

    <path d="M600 300 L600 90" stroke="url(#radarGold)" stroke-width="1.8" opacity="0.75"/>
    <path d="M600 300 L1040 300" stroke="url(#radarGold)" stroke-width="1.8" opacity="0.55"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#edf5ff">
    <text x="522" y="70">DATA ANALYST</text>
    <text x="414" y="155">DATA ANALYTICS</text>
    <text x="705" y="120">BUSINESS INTELLIGENCE</text>
    <text x="190" y="430">PYTHON</text>
    <text x="805" y="440">SQL</text>
    <text x="792" y="555">POWER BI</text>
    <text x="260" y="250">AI</text>
  </g>

  <g>
    <circle cx="600" cy="300" r="6" fill="#f4d27a"/>
    <circle cx="469" cy="150" r="6" fill="#79d5ff"/>
    <circle cx="740" cy="123" r="6" fill="#79d5ff"/>
    <circle cx="425" cy="425" r="6" fill="#79d5ff"/>
    <circle cx="780" cy="440" r="6" fill="#79d5ff"/>
  </g>

  <g stroke="url(#radarBlue)" stroke-width="2" fill="none" opacity="0.8">
    <path d="M600 300 L600 90">
      <animateTransform attributeName="transform" type="rotate" from="0 600 300" to="360 600 300" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M600 300 L1040 300">
      <animateTransform attributeName="transform" type="rotate" from="0 600 300" to="360 600 300" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <g opacity="0.45">
    <path d="M600 300 L680 122 L780 170 L760 325 L600 300 Z" fill="url(#radarBlue)"/>
  </g>
</svg>
