<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Career radar for Data Analyst and AI">
  <defs>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ec5ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8ec5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="420" fill="#081321"/>

  <g>
    <circle cx="600" cy="210" r="140" fill="url(#radarGlow)"/>
    <circle cx="600" cy="210" r="110" fill="none" stroke="#7bb6ff" stroke-width="1" opacity="0.5"/>
    <circle cx="600" cy="210" r="80" fill="none" stroke="#7bb6ff" stroke-width="1" opacity="0.5"/>
    <circle cx="600" cy="210" r="50" fill="none" stroke="#7bb6ff" stroke-width="1" opacity="0.5"/>
  </g>

  <g>
    <path d="M600 210 L600 70" stroke="#f3d788" stroke-width="1.5" opacity="0.9"><animateTransform attributeName="transform" type="rotate" from="0 600 210" to="360 600 210" dur="12s" repeatCount="indefinite"/></path>
    <path d="M600 210 L760 110" stroke="#f3d788" stroke-width="1.5" opacity="0.7"><animateTransform attributeName="transform" type="rotate" from="-20 600 210" to="340 600 210" dur="12s" repeatCount="indefinite"/></path>
    <path d="M600 210 L1060 210" stroke="#7cc1ff" stroke-width="1" opacity="0.2"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#dfeaff" text-anchor="middle">
    <text x="600" y="45">DATA ANALYST</text>
    <text x="600" y="380">BUSINESS INTELLIGENCE</text>
    <text x="520" y="90">AI</text>
    <text x="1020" y="215">PYTHON</text>
    <text x="600" y="330">SQL</text>
    <text x="180" y="215">DATA SCIENCE</text>
  </g>

  <g>
    <circle cx="600" cy="70" r="6" fill="#f3d788"><animate attributeName="r" values="6;9;6" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="110" r="6" fill="#f3d788"><animate attributeName="r" values="6;9;6" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="210" r="6" fill="#f3d788"><animate attributeName="r" values="6;9;6" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="330" r="6" fill="#f3d788"><animate attributeName="r" values="6;9;6" dur="2.6s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="215" r="6" fill="#f3d788"><animate attributeName="r" values="6;9;6" dur="2.6s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="90" r="6" fill="#f3d788"><animate attributeName="r" values="6;9;6" dur="2.6s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#f3d788" opacity="0.9">
    <circle r="3"><animateMotion dur="6s" repeatCount="indefinite" path="M600 210 L600 70"/></circle>
    <circle r="3"><animateMotion dur="6.5s" repeatCount="indefinite" path="M600 210 L760 110"/></circle>
    <circle r="3"><animateMotion dur="6.8s" repeatCount="indefinite" path="M600 210 L1020 210"/></circle>
  </g>
</svg>
