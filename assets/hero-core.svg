<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-label="SARAVANA VEL live tech hero">
  <defs>
    <linearGradient id="bgHero" x1="0" x2="1">
      <stop offset="0%" stop-color="#050b18"/>
      <stop offset="35%" stop-color="#0d1830"/>
      <stop offset="70%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#f6d98f"/>
      <stop offset="50%" stop-color="#d4a93e"/>
      <stop offset="100%" stop-color="#8cc9ff"/>
    </linearGradient>
    <linearGradient id="lineBlue" x1="0" x2="1">
      <stop offset="0%" stop-color="#6caaf5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8cc9ff" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="goldPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f9e7a5" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f0c75d" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f0c75d" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1400" height="520" fill="url(#bgHero)"/>

  <g opacity="0.75">
    <g fill="#8ec5ff" opacity="0.7">
      <circle cx="90" cy="110" r="1.8"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="80" r="1.5"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="15s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="120" r="1.6"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="13s" repeatCount="indefinite"/></circle>
      <circle cx="920" cy="90" r="1.7"><animate attributeName="opacity" values="0.25;0.75;0.25" dur="17s" repeatCount="indefinite"/></circle>
      <circle cx="1230" cy="110" r="1.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="15s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="260" r="1.6"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="260" r="2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="300" r="1.7"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="14s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#f9d77c" opacity="0.8">
      <circle cx="260" cy="180" r="1.7"/><circle cx="560" cy="220" r="1.5"/><circle cx="810" cy="180" r="1.8"/><circle cx="1110" cy="200" r="1.6"/>
    </g>
  </g>

  <g stroke="url(#lineBlue)" stroke-width="1" fill="none" opacity="0.7">
    <path d="M120 120 L300 160 L470 120 L610 185 L820 160 L980 200 L1240 150"/>
    <path d="M180 260 L340 210 L520 240 L665 190 L890 235 L1060 210 L1210 250"/>
    <path d="M240 90 L450 220 L610 120 L820 260 L1080 150"/>
    <path d="M460 300 L620 220 L800 310 L1010 220 L1110 300"/>
  </g>

  <g>
    <circle cx="300" cy="160" r="5" fill="#8ec5ff"/>
    <circle cx="470" cy="120" r="5" fill="#8ec5ff"/>
    <circle cx="610" cy="185" r="5" fill="#8ec5ff"/>
    <circle cx="820" cy="160" r="5" fill="#8ec5ff"/>
    <circle cx="980" cy="200" r="5" fill="#8ec5ff"/>
    <circle cx="520" cy="240" r="4.5" fill="#f6d98f"/>
    <circle cx="890" cy="235" r="4.5" fill="#f6d98f"/>
    <circle cx="1060" cy="210" r="4.5" fill="#f6d98f"/>
    <circle cx="800" cy="310" r="4.5" fill="#8ec5ff"/>
  </g>

  <g>
    <circle r="25" cx="700" cy="250" fill="none" stroke="url(#coreGlow)" stroke-width="2" opacity="0.9">
      <animate attributeName="r" values="25;31;25" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="18" cx="700" cy="250" fill="url(#goldPulse)" filter="url(#softBlur)">
      <animate attributeName="r" values="18;26;18" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="15" cx="700" cy="250" fill="#f2cf70" opacity="0.9">
      <animate attributeName="r" values="15;18;15" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" cx="700" cy="250" fill="#ffffff" opacity="0.9"/>
  </g>

  <g>
    <path d="M150 260 C420 180, 500 170, 700 250 S 980 350, 1250 260" fill="none" stroke="#f0c75d" stroke-width="1.5" opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.25;0.85;0.25" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle r="4" fill="#f6d98f">
      <animateMotion dur="6s" repeatCount="indefinite" path="M150 260 C420 180, 500 170, 700 250 S 980 350, 1250 260"/>
    </circle>
  </g>

  <g>
    <text x="700" y="220" text-anchor="middle" font-size="58" font-weight="800" letter-spacing="8" fill="#f5d78a" font-family="Segoe UI, Arial, sans-serif">SARAVANA VEL</text>
    <text x="700" y="285" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="5" fill="#e5efff" font-family="Segoe UI, Arial, sans-serif">ASPIRING DATA ANALYST</text>
    <text x="700" y="320" text-anchor="middle" font-size="15" font-weight="500" letter-spacing="4" fill="#9ecbff" font-family="Segoe UI, Arial, sans-serif">AI • DATA • PYTHON • ANALYTICS</text>
  </g>

  <g opacity="0.8">
    <circle cx="700" cy="250" r="116" fill="none" stroke="#7aaef1" stroke-width="1.2" opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" from="0 700 250" to="360 700 250" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="250" r="150" fill="none" stroke="#f0c75d" stroke-width="1" opacity="0.18">
      <animateTransform attributeName="transform" type="rotate" from="360 700 250" to="0 700 250" dur="28s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-size="10" fill="#dfeaff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="0.8">
    <text x="700" y="120">PYTHON</text>
    <text x="1070" y="175">SQL</text>
    <text x="1180" y="266">DATA</text>
    <text x="980" y="365">AI</text>
    <text x="420" y="365">ANALYTICS</text>
    <text x="240" y="180">API</text>
  </g>
</svg>
