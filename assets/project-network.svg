<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Project network for SARAVANA VEL">
  <defs>
    <linearGradient id="projLine" x1="0" x2="1">
      <stop offset="0%" stop-color="#79b5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f4d27a" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="coreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd978"/>
      <stop offset="100%" stop-color="#ffd978" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="520" fill="#081322"/>

  <g stroke="url(#projLine)" stroke-width="1.8" fill="none" opacity="0.9">
    <path d="M260 205 L520 260 L790 205"/>
    <path d="M260 205 L520 260 L520 395"/>
    <path d="M790 205 L520 260 L920 395"/>
    <path d="M520 395 L520 260 L520 145"/>
    <path d="M520 395 L610 450"/>
  </g>

  <g>
