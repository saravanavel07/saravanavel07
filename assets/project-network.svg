    <circle cx="790" cy="205" r="16" fill="#7fc3ff" opacity="0.9"><animate attributeName="r" values="16;20;16" dur="3.4s" repeatCount="indefinite"/></circle>
    <text x="790" y="170" font-size="14" text-anchor="middle" fill="#dfeaff" font-family="Segoe UI, Arial, sans-serif" font-weight="700">API HUB</text>

    <circle cx="520" cy="260" r="34" fill="url(#coreHalo)" opacity="0.9"><animate attributeName="r" values="30;38;30" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="260" r="18" fill="#f4d27a" opacity="0.95"><animate attributeName="r" values="18;23;18" dur="4s" repeatCount="indefinite"/></circle>
    <text x="520" y="228" font-size="16" text-anchor="middle" fill="#0a1220" font-family="Segoe UI, Arial, sans-serif" font-weight="800">VEL CORE</text>

    <circle cx="520" cy="395" r="16" fill="#7fc3ff" opacity="0.9"><animate attributeName="r" values="16;20;16" dur="3.7s" repeatCount="indefinite"/></circle>
    <text x="520" y="435" font-size="14" text-anchor="middle" fill="#dfeaff" font-family="Segoe UI, Arial, sans-serif" font-weight="700">APTI DUDE</text>

    <circle cx="920" cy="395" r="16" fill="#7fc3ff" opacity="0.9"><animate attributeName="r" values="16;20;16" dur="3.3s" repeatCount="indefinite"/></circle>
    <text x="920" y="430" font-size="14" text-anchor="middle" fill="#dfeaff" font-family="Segoe UI, Arial, sans-serif" font-weight="700">HARNESS PROMPT CREATOR</text>

    <circle cx="520" cy="145" r="16" fill="#7fc3ff" opacity="0.9"><animate attributeName="r" values="16;20;16" dur="3.2s" repeatCount="indefinite"/></circle>
    <text x="520" y="115" font-size="14" text-anchor="middle" fill="#dfeaff" font-family="Segoe UI, Arial, sans-serif" font-weight="700">QUANTIZER AI</text>
