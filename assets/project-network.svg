    </path>
    <circle r="5" fill="#f3d788">
      <animateMotion dur="6.5s" repeatCount="indefinite" path="M520 260 C620 290, 700 235, 790 205"/>
    </circle>
  </g>

  <g>
    <path d="M520 260 C540 310, 520 350, 520 395" stroke="#f3d788" stroke-width="2.2" fill="none" opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="8s" repeatCount="indefinite"/>
    </path>
    <circle r="5" fill="#f3d788">
      <animateMotion dur="8s" repeatCount="indefinite" path="M520 260 C540 310, 520 350, 520 395"/>
    </circle>
