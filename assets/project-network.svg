    </path>
    <circle r="5" fill="#f3d788">
      <animateMotion dur="7s" repeatCount="indefinite" path="M260 205 C350 240, 430 250, 520 260"/>
    </circle>
  </g>

  <g>
    <path d="M520 260 C620 290, 700 235, 790 205" stroke="#f3d788" stroke-width="2.4" fill="none" opacity="0.8">
